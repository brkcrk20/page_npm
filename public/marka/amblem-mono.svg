    <!-- baş + sivri kulaklar tek parça: kulak başa yapışık -->
    <path d="M44.5 33.4c-.9 0-1.8.2-2.6.6l-1.5-3.9c-.3-.7.5-1.3 1.1-.9l3.5 2.2 3.5-2.2c.6-.4 1.4.2 1.1.9l-1.5 3.9c2.4 1.1 3.9 3.4 3.4 5.9-.4 2.3-2.4 4-4.8 4.1-3 .1-5.5-2.3-5.5-5.2 0-2.3 1.5-4.3 3.6-5Z"/>
    <circle cx="44.5" cy="38.6" r="5.2"/>
  </g>
</svg>
