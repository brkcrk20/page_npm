    <!-- baş -->
    <circle cx="23.4" cy="35.6" r="5.6"/>
    <!-- burun -->
    <path d="M28.4 33.9c1.9.2 3.2 1 3.8 2.1.3.5-.1 1.1-.7 1.1-1.3 0-2.4-.2-3.3-.7Z"/>
  </g>

  <!-- KEDİ -->
  <g fill="currentColor">
    <!-- kuyruk -->
    <path d="M47.6 56.2c2.9-.5 4.6-2.3 4.6-4.7 0-1.8-.9-3.1-2.4-3.7-.8-.3-1.6.2-1.7.9-.1.7.2 1.3.9 1.6.5.2.8.6.8 1.1 0 .9-.7 1.5-2.2 1.8Z"/>
    <!-- gövde -->
