<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PetSemti" class="ps-amblem-mono">
  <title>PetSemti</title>
  <!-- YUVA: güvenli alan -->
  <path d="M32 5 4.8 26.4v27.1A4.5 4.5 0 0 0 9.3 58h45.4a4.5 4.5 0 0 0 4.5-4.5V26.4L32 5Z"
        fill="none" stroke="currentColor" stroke-width="4.6" stroke-linejoin="round"/>

  <!-- SEVGİ -->
  <path d="M32 17.8c-1.8-2.4-5.9-2-5.9 1.4 0 2.6 3.4 4.9 5.9 6.8 2.5-1.9 5.9-4.2 5.9-6.8 0-3.4-4.1-3.8-5.9-1.4Z"
        fill="currentColor"/>

  <!-- KÖPEK -->
  <g fill="currentColor">
    <!-- sarkık kulak: başın üstünden başlayıp sola iniyor -->
    <path d="M21 31.4c-3.2-1.1-6 .6-6.6 4-.5 3.2 1 6.2 3.4 6.9 1.4.4 2.5-.4 2.7-1.8Z"/>
